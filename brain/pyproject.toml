[project]
name = "fly-brain"
version = "0.1.0"
description = "Real Drosophila connectome control core for a Minecraft agent"
requires-python = ">=3.11"
dependencies = [
    "neuprint-python",
    "numpy",
    "scipy",
    "pandas",
    "pyarrow",
    "websockets>=12",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
